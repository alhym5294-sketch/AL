<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل وجه الموظف - نظام MUQ</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .face-registration-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
        }

        #videoElement {
            width: 100%;
            border-radius: 10px;
            border: 3px solid var(--primary-orange);
        }

        .face-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 3px solid var(--primary-orange);
            border-radius: 50%;
            pointer-events: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.3);
        }

        .face-frame.valid {
            border-color: var(--success);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .face-frame.invalid {
            border-color: var(--error);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        .overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.1em;
            text-align: center;
            z-index: 10;
        }

        .overlay.success {
            background: rgba(0, 255, 0, 0.8);
        }

        .overlay.warning {
            background: rgba(255, 165, 0, 0.8);
        }

        .overlay.error {
            background: rgba(255, 0, 0, 0.8);
        }

        .progress-container {
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: var(--elevated-bg);
            border-radius: 15px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--brand-gradient);
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .stat-box {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid var(--border-strong);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: var(--primary-orange);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9em;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: var(--elevated-bg);
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            border: 1px solid var(--primary-orange);
        }

        .back-btn:hover {
            background: var(--primary-orange);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-weight: bold;
        }

        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--border-strong);
            border-radius: 8px;
            background: var(--dark-bg);
            color: #fff;
            font-size: 1em;
        }

        .form-group select:focus {
            outline: none;
            border-color: var(--primary-orange);
        }
    </style>
</head>
<body>
    <div class="face-registration-container">
        <a href="staff-dashboard.html" class="back-btn">← العودة للوحة الموظف</a>

        <h1>تسجيل وجه الموظف</h1>
        <p>يرجى التقاط 3 صور من زوايا مختلفة</p>

        <div class="form-group" style="margin-bottom: 20px;">
            <label>اختر الموظف</label>
            <select id="staffSelect" onchange="selectStaff()">
                <option value="">-- اختر الموظف --</option>
            </select>
        </div>

        <div class="camera-container">
            <video id="videoElement" autoplay playsinline></video>
            <canvas id="canvasElement" style="display: none;"></canvas>
            <div class="face-frame" id="faceFrame"></div>
            <div class="overlay" id="overlay">تحضير الكاميرا...</div>
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0/3</div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-number" id="acceptedCount">0</div>
                <div class="stat-label">مقبولة</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="rejectedCount">0</div>
                <div class="stat-label">مرفوضة</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="qualityScore">0%</div>
                <div class="stat-label">الجودة</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-add" id="startBtn" onclick="startRegistration()">بدء التسجيل</button>
            <button class="btn btn-delete" id="stopBtn" onclick="stopRegistration()" disabled>إيقاف</button>
            <button class="btn btn-add" id="saveBtn" onclick="saveFaceData()" disabled>حفظ البيانات</button>
        </div>
    </div>

    <script src="../Js/face-config.js"></script>
    <script src="../Js/face-recognition-engine.js"></script>
    <script src="../Js/face-storage.js"></script>
    <script src="../Js/database.js"></script>
    <script>
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasElement');
        const faceFrame = document.getElementById('faceFrame');
        const overlay = document.getElementById('overlay');
        const progressFill = document.getElementById('progressFill');
        const acceptedCount = document.getElementById('acceptedCount');
        const rejectedCount = document.getElementById('rejectedCount');
        const qualityScore = document.getElementById('qualityScore');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const saveBtn = document.getElementById('saveBtn');

        let isRegistering = false;
        let samples = [];
        let accepted = 0;
        let rejected = 0;
        let captureInterval = null;
        let currentUser = null;

        // تحميل قائمة الموظفين
        function loadStaffList() {
            const db = new Database();
            const staffSelect = document.getElementById('staffSelect');

            // إضافة الموظفين الإداريين
            const adminStaff = db.getAdministrativeStaff();
            adminStaff.forEach(staff => {
                const option = document.createElement('option');
                option.value = `administrative:${staff.id}`;
                option.textContent = `${staff.name} (إداري)`;
                staffSelect.appendChild(option);
            });

            // إضافة الموظفين الأمنيين
            const securityStaff = db.getSecurityStaff();
            securityStaff.forEach(staff => {
                const option = document.createElement('option');
                option.value = `security:${staff.id}`;
                option.textContent = `${staff.name} (أمني)`;
                staffSelect.appendChild(option);
            });

            // إضافة موظفي الخدمة
            const serviceStaff = db.getServiceStaff();
            serviceStaff.forEach(staff => {
                const option = document.createElement('option');
                option.value = `service:${staff.id}`;
                option.textContent = `${staff.name} (خدمة)`;
                staffSelect.appendChild(option);
            });
        }

        // اختيار الموظف
        function selectStaff() {
            const staffSelect = document.getElementById('staffSelect');
            const value = staffSelect.value;

            if (!value) {
                currentUser = null;
                return;
            }

            const [type, id] = value.split(':');
            const db = new Database();

            switch(type) {
                case 'administrative':
                    currentUser = db.getAdministrativeStaff().find(s => s.id === parseInt(id));
                    break;
                case 'security':
                    currentUser = db.getSecurityStaff().find(s => s.id === parseInt(id));
                    break;
                case 'service':
                    currentUser = db.getServiceStaff().find(s => s.id === parseInt(id));
                    break;
            }
        }

        // بدء الكاميرا
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                overlay.textContent = 'جاهز للتسجيل';
                overlay.className = 'overlay success';
            } catch (error) {
                console.error('خطأ في الكاميرا:', error);
                overlay.textContent = 'فشل في تشغيل الكاميرا';
                overlay.className = 'overlay error';
            }
        }

        // بدء التسجيل
        function startRegistration() {
            if (isRegistering) return;

            if (!currentUser) {
                alert('يرجى اختيار الموظف أولاً');
                return;
            }

            isRegistering = true;
            samples = [];
            accepted = 0;
            rejected = 0;
            updateStats();

            startBtn.disabled = true;
            stopBtn.disabled = false;
            saveBtn.disabled = true;

            // التقاط تلقائي
            captureInterval = setInterval(captureSample, 1000);
        }

        // إيقاف التسجيل
        function stopRegistration() {
            isRegistering = false;
            if (captureInterval) {
                clearInterval(captureInterval);
                captureInterval = null;
            }

            startBtn.disabled = false;
            stopBtn.disabled = true;
            saveBtn.disabled = samples.length > 0;

            overlay.textContent = samples.length >= 3 ? 'اكتمل التسجيل' : 'تم الإيقاف';
            overlay.className = samples.length >= 3 ? 'overlay success' : 'overlay warning';
        }

        // التقاط عينة
        async function captureSample() {
            if (!isRegistering || samples.length >= 3) {
                stopRegistration();
                return;
            }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);

            // محاكاة استخراج embedding
            const embedding = Array(128).fill(0).map(() => Math.random());
            const quality = 0.8 + Math.random() * 0.2;

            samples.push({
                embedding: embedding,
                pose: 'front',
                quality: quality,
                capturedAt: new Date().toISOString()
            });

            accepted++;
            updateStats();
            updateProgress();
        }

        // تحديث الإحصائيات
        function updateStats() {
            acceptedCount.textContent = accepted;
            rejectedCount.textContent = rejected;
            qualityScore.textContent = samples.length > 0 ? '85%' : '0%';
        }

        // تحديث التقدم
        function updateProgress() {
            const progress = (samples.length / 3) * 100;
            progressFill.style.width = progress + '%';
            progressFill.textContent = `${samples.length}/3`;
        }

        // حفظ البيانات
        async function saveFaceData() {
            if (samples.length === 0) {
                alert('لا توجد عينات للحفظ');
                return;
            }

            try {
                const faceData = {
                    version: 2,
                    model: 'face-api.js',
                    samples: samples,
                    legacyImages: [],
                    createdAt: new Date().toISOString()
                };

                const db = new Database();
                const storageKey = `muq_${currentUser.type}_staff`;
                const staffList = JSON.parse(localStorage.getItem(storageKey)) || [];
                const staffIndex = staffList.findIndex(s => s.id === currentUser.id);

                if (staffIndex !== -1) {
                    staffList[staffIndex].faceData = faceData;
                    localStorage.setItem(storageKey, JSON.stringify(staffList));
                    alert('تم حفظ بيانات الوجه بنجاح!');
                    window.location.href = 'staff-dashboard.html';
                }
            } catch (error) {
                console.error('خطأ في الحفظ:', error);
                alert('فشل في حفظ البيانات');
            }
        }

        // التهيئة
        startCamera();
        loadStaffList();
    </script>
</body>
</html>
