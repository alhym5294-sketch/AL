<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدخول - نظام الاستعلامات</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background: var(--page-bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .kiosk-container {
            width: 100%;
            max-width: 1400px;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        .camera-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            border: 2px solid var(--primary-orange);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            border: 2px solid var(--border-strong);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .log-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            border: 2px solid var(--border-strong);
            display: flex;
            flex-direction: column;
            max-height: 600px;
        }

        h1 {
            color: var(--primary-orange);
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        h2 {
            color: var(--primary-orange);
            margin-bottom: 15px;
            font-size: 1.8em;
        }

        #video {
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            border: 3px solid var(--border-strong);
        }

        #canvas {
            display: none;
        }

        .status-display {
            margin-top: 20px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
        }

        .status-waiting {
            background: var(--elevated-bg);
            color: #fff;
            border: 2px solid #555;
        }

        .status-granted {
            background: linear-gradient(135deg, var(--success), #00cc00);
            color: #000;
            border: 2px solid var(--success);
            animation: pulse-green 1s infinite;
        }

        .status-denied {
            background: linear-gradient(135deg, var(--error), #cc0000);
            color: #fff;
            border: 2px solid var(--error);
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-green {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes pulse-red {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .person-info {
            margin-top: 20px;
            padding: 20px;
            background: var(--dark-bg);
            border-radius: 15px;
            border: 1px solid var(--border-strong);
        }

        .person-info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-strong);
        }

        .person-info-item:last-child {
            border-bottom: none;
        }

        .person-info-label {
            color: var(--text-secondary);
            font-weight: bold;
        }

        .person-info-value {
            color: var(--primary-orange);
            font-weight: bold;
        }

        .instruction {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 20px;
            font-size: 1.2em;
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: var(--primary-orange);
            animation: scan 2s linear infinite;
            display: none;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .camera-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
        }

        @media (max-width: 768px) {
            .kiosk-container {
                grid-template-columns: 1fr;
            }
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .log-table th {
            background: var(--elevated-bg);
            color: var(--primary-orange);
            padding: 10px;
            text-align: right;
            font-weight: bold;
            position: sticky;
            top: 0;
        }

        .log-table td {
            padding: 8px;
            border-bottom: 1px solid var(--border-strong);
            color: var(--text-secondary);
        }

        .log-table tr:hover {
            background: var(--dark-bg);
        }

        .log-table tr.granted {
            border-left: 3px solid var(--success);
        }

        .log-table tr.denied {
            border-left: 3px solid var(--error);
        }

        .log-container {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
        }

        .log-header {
            color: var(--primary-orange);
            font-size: 1.3em;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-strong);
        }

        .status-badge {
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .status-badge.granted {
            background: var(--success);
            color: #000;
        }

        .status-badge.denied {
            background: var(--error);
            color: #fff;
        }
    </style>
    <script src="../Js/portal-auth.js"></script>
    <script>requirePortalAccess('gate');</script>
</head>
<body>
    <div class="kiosk-container">
        <div class="camera-section">
            <h1>بوابة الدخول</h1>
            <div class="camera-wrapper">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
                <div class="scan-line" id="scanLine"></div>
            </div>
            <p class="instruction">انظر إلى الكاميرا للتحقق من هويتك</p>
        </div>

        <div class="info-section">
            <h2>حالة الدخول</h2>
            <div class="status-display status-waiting" id="statusDisplay">
                في انتظار التعرف...
            </div>

            <div class="person-info" id="personInfo" style="display: none;">
                <div class="person-info-item">
                    <span class="person-info-label">الاسم:</span>
                    <span class="person-info-value" id="personName">-</span>
                </div>
                <div class="person-info-item">
                    <span class="person-info-label">النوع:</span>
                    <span class="person-info-value" id="personType">-</span>
                </div>
                <div class="person-info-item">
                    <span class="person-info-label">القسم:</span>
                    <span class="person-info-value" id="personDepartment">-</span>
                </div>
                <div class="person-info-item">
                    <span class="person-info-label">الوقت:</span>
                    <span class="person-info-value" id="entryTime">-</span>
                </div>
            </div>

            <button class="btn btn-primary" onclick="startRecognition()" style="margin-top: 20px; width: 100%;">
                بدء التعرف
            </button>
        </div>

        <div class="log-section">
            <h2>سجل الدخول</h2>
            <div class="log-container">
                <table class="log-table">
                    <thead>
                        <tr>
                            <th>الوقت</th>
                            <th>الاسم</th>
                            <th>الحالة</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody">
                    </tbody>
                </table>
            </div>
            <button class="btn btn-secondary" onclick="clearLog()" style="margin-top: 10px; width: 100%;">
                مسح السجل
            </button>
        </div>
    </div>

    <script src="../Js/face-config.js"></script>
    <script src="../Js/face-recognition-engine.js"></script>
    <script src="../Js/face-storage.js"></script>
    <script src="../Js/database.js"></script>
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusDisplay = document.getElementById('statusDisplay');
        const personInfo = document.getElementById('personInfo');
        const scanLine = document.getElementById('scanLine');

        let isRecognizing = false;
        let recognitionInterval = null;
        let entryLog = [];

        // تحميل النماذج وبدء الكاميرا
        async function init() {
            try {
                // تحميل النماذج
                await faceEngine.loadModels();
                console.log('✅ تم تحميل النماذج');

                // بدء الكاميرا
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                console.log('✅ تم تشغيل الكاميرا');
            } catch (error) {
                console.error('❌ خطأ في التهيئة:', error);
                statusDisplay.textContent = 'خطأ في تشغيل الكاميرا';
                statusDisplay.className = 'status-display status-denied';
            }
        }

        // بدء التعرف
        function startRecognition() {
            if (isRecognizing) {
                stopRecognition();
                return;
            }

            isRecognizing = true;
            scanLine.style.display = 'block';
            statusDisplay.textContent = 'جاري التعرف...';
            statusDisplay.className = 'status-display status-waiting';
            personInfo.style.display = 'none';

            // التعرف كل 2 ثانية
            recognitionInterval = setInterval(recognizeFace, 2000);
        }

        // إيقاف التعرف
        function stopRecognition() {
            isRecognizing = false;
            scanLine.style.display = 'none';
            if (recognitionInterval) {
                clearInterval(recognitionInterval);
                recognitionInterval = null;
            }
        }

        // التعرف على الوجه
        async function recognizeFace() {
            try {
                // التقاط الصورة
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);

                // استخراج الوجه
                const detection = await faceEngine.detectFace(canvas);

                if (!detection) {
                    statusDisplay.textContent = 'لم يتم اكتشاف وجه';
                    return;
                }

                // استخراج embedding
                const embedding = await faceEngine.extractEmbedding(canvas, detection);

                if (!embedding) {
                    statusDisplay.textContent = 'فشل في استخراج بيانات الوجه';
                    return;
                }

                // البحث في جميع الأشخاص المسجلين
                const result = await faceStorage.recognizePerson(embedding);

                if (result.matched) {
                    // الشخص مسموح له بالدخول
                    statusDisplay.textContent = '✅ مسموح بالدخول';
                    statusDisplay.className = 'status-display status-granted';

                    // عرض معلومات الشخص
                    personInfo.style.display = 'block';
                    document.getElementById('personName').textContent = result.person.name;
                    document.getElementById('personType').textContent = getPersonTypeLabel(result.person.type);
                    document.getElementById('personDepartment').textContent = result.person.department || '-';
                    document.getElementById('entryTime').textContent = new Date().toLocaleTimeString('ar-EG');

                    // إضافة إلى سجل الدخول
                    addToLog(result.person.name, 'مسموح', true);

                    // تسجيل الحضور
                    await recordAttendance(result.person);

                    // إيقاف التعرف بعد النجاح
                    stopRecognition();

                    // إعادة التشغيل بعد 5 ثواني
                    setTimeout(() => {
                        statusDisplay.textContent = 'في انتظار التعرف...';
                        statusDisplay.className = 'status-display status-waiting';
                        personInfo.style.display = 'none';
                        startRecognition();
                    }, 5000);
                } else {
                    // الشخص غير مسجل
                    statusDisplay.textContent = '❌ غير مسموح بالدخول';
                    statusDisplay.className = 'status-display status-denied';
                    personInfo.style.display = 'none';

                    // إضافة إلى سجل الدخول
                    addToLog('غير معروف', 'غير مسموح', false);

                    // إعادة المحاولة بعد 3 ثواني
                    setTimeout(() => {
                        statusDisplay.textContent = 'جاري التعرف...';
                        statusDisplay.className = 'status-display status-waiting';
                    }, 3000);
                }
            } catch (error) {
                console.error('خطأ في التعرف:', error);
                statusDisplay.textContent = 'خطأ في التعرف';
            }
        }

        // تحويل نوع الشخص إلى نص
        function getPersonTypeLabel(type) {
            const labels = {
                'student': 'طالب',
                'teacher': 'مدرس',
                'administrative': 'موظف إداري',
                'security': 'موظف أمني',
                'service': 'موظف خدمة'
            };
            return labels[type] || type;
        }

        // تسجيل الحضور
        async function recordAttendance(person) {
            try {
                const db = new Database();
                const attendance = db.getAttendance();
                const today = new Date().toISOString().split('T')[0];

                // التحقق من عدم تسجيل الحضور مسبقاً اليوم
                const existing = attendance.find(a =>
                    a.personId === person.id &&
                    a.personType === person.type &&
                    a.date === today
                );

                if (!existing) {
                    attendance.push({
                        id: Date.now(),
                        personId: person.id,
                        personType: person.type,
                        date: today,
                        time: new Date().toLocaleTimeString('ar-EG'),
                        status: 'present',
                        location: 'البوابة الرئيسية'
                    });
                    db.saveAttendance(attendance);
                    console.log('✅ تم تسجيل الحضور');
                }
            } catch (error) {
                console.error('خطأ في تسجيل الحضور:', error);
            }
        }

        // إضافة إلى سجل الدخول
        function addToLog(name, status, granted) {
            const entry = {
                time: new Date().toLocaleTimeString('ar-EG'),
                name: name,
                status: status,
                granted: granted
            };

            entryLog.unshift(entry); // إضافة في البداية

            // الاحتفاظ بآخر 50 سجل فقط
            if (entryLog.length > 50) {
                entryLog = entryLog.slice(0, 50);
            }

            updateLogTable();
        }

        // تحديث جدول السجل
        function updateLogTable() {
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = '';

            entryLog.forEach(entry => {
                const row = document.createElement('tr');
                row.className = entry.granted ? 'granted' : 'denied';

                const statusBadge = document.createElement('span');
                statusBadge.className = `status-badge ${entry.granted ? 'granted' : 'denied'}`;
                statusBadge.textContent = entry.status;

                row.innerHTML = `
                    <td>${entry.time}</td>
                    <td>${entry.name}</td>
                    <td></td>
                `;

                row.lastChild.appendChild(statusBadge);
                tbody.appendChild(row);
            });
        }

        // مسح السجل
        function clearLog() {
            entryLog = [];
            updateLogTable();
        }

        // التهيئة عند التحميل
        init();
    </script>
</body>
</html>
