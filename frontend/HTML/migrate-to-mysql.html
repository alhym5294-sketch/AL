<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترحيل البيانات إلى MySQL - نظام MUQ</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .migration-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid var(--primary-orange);
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin: 10px;
        }

        .btn-primary {
            background: var(--brand-gradient);
            color: #fff;
        }

        .btn-secondary {
            background: var(--dark-bg);
            color: #fff;
            border: 1px solid var(--primary-orange);
        }

        .log-box {
            background: var(--dark-bg);
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: var(--success);
        }

        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            text-align: center;
        }

        .status.success {
            background: var(--success);
            color: #000;
        }

        .status.error {
            background: var(--error);
            color: #fff;
        }

        .status.info {
            background: var(--dark-bg);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="migration-container">
        <h1>ترحيل البيانات إلى MySQL</h1>

        <div class="status info" id="status">
            تأكد من تشغيل MySQL Server قبل البدء
        </div>

        <div style="text-align: center;">
            <button class="btn btn-primary" onclick="startMigration()">بدء الترحيل</button>
            <button class="btn btn-secondary" onclick="testConnection()">اختبار الاتصال</button>
        </div>

        <div class="log-box" id="logBox">
            <div>انتظر لبدء الترحيل...</div>
        </div>
    </div>

    <script src="../Js/face-config.js"></script>
    <script src="../Js/database-api.js"></script>
    <script src="../Js/data-migration.js"></script>
    <script>
        function log(message) {
            const logBox = document.getElementById('logBox');
            const timestamp = new Date().toLocaleTimeString();
            logBox.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function setStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
        }

        async function testConnection() {
            setStatus('جاري اختبار الاتصال بـ MySQL...', 'info');
            log('🔍 اختبار الاتصال بـ MySQL...');

            try {
                const result = await dbAPI.getDepartments();
                if (result) {
                    setStatus('✅ الاتصال بـ MySQL ناجح!', 'success');
                    log('✅ الاتصال ناجح - يمكن البدء بالترحيل');
                } else {
                    setStatus('❌ فشل الاتصال', 'error');
                    log('❌ فشل الاتصال: ' + (result.error || 'Unknown error'));
                }
            } catch (error) {
                setStatus('❌ خطأ في الاتصال', 'error');
                log('❌ خطأ: ' + error.message);
            }
        }

        async function startMigration() {
            setStatus('جاري ترحيل البيانات...', 'info');
            log('🔄 بدء ترحيل البيانات من localStorage إلى MySQL...');

            const result = await dataMigration.migrateAll();

            if (result.success) {
                setStatus('✅ تم الترحيل بنجاح!', 'success');
                log('✅ تم ترحيل جميع البيانات بنجاح!');
                log('📊 يمكنك الآن استخدام النظام بـ MySQL');
            } else {
                setStatus('❌ فشل الترحيل', 'error');
                log('❌ فشل الترحيل: ' + result.error);
            }
        }
    </script>
</body>
</html>
